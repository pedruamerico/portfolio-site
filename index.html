    <!-- tema e idioma salvos aplicados antes da primeira pintura, sem flash -->
    <script>
      try {
        var t = localStorage.getItem('pa-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = new URLSearchParams(location.search).get('lang') || localStorage.getItem('pa-lang');
        if (l === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
